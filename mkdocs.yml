site_name: "Slipstream Transit"
site_description: "Player guide for Slipstream Transit"
edit_uri: ""
theme:
  name: readthedocs
  highlightjs: true
  logo: assets/logo.svg
  navigation_depth: 3
  prev_next_buttons_location: bottom
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
validation:
  links:
    not_found: warn
    anchors: warn
nav:
  - Overview: index.md
  - Installation: installation.md
  - First steps: getting-started.md
  - Progression: progression.md
  - Features: features/index.md
  - Recipes: recipes.md
  - Screenshots: gallery.md
  - Configuration: configuration.md
  - Troubleshooting: troubleshooting.md
  - Changelog: changelog.md

repo_url: https://github.com/jkswoods/slipstream-transit
extra_css:
  - assets/stylesheets/slipstream.css
